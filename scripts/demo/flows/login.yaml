# Signs the demo account in. ${EMAIL} comes from the caller (-e EMAIL=…).
appId: com.lunashoots.ios.dev
---
# Starts from the sign-in screen — sign the previous account out first
# (logout.yaml). Clearing the app's state instead brings back iOS's
# notification prompt, which Maestro cannot answer reliably.
- launchApp
- runFlow:
    when:
      visible: "Back to sign in"
    commands:
      - tapOn: "Back to sign in"
# iOS's own notification prompt: Maestro sees it but cannot tap it by text,
# so the «Allow» button's spot. Harmless when the prompt is not there.
- extendedWaitUntil:
    visible: "Luna Shoots"
    timeout: 15000
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          point: "67%,58%"
- tapOn:
    text: "your@mail.com"
- inputText: ${EMAIL}
- tapOn: "Crew, location, references and confirmations — in one place"
- tapOn:
    text: "Password"
    index: 1
# In pieces: typed in one go into a secure field, iOS sometimes kept only the
# first few characters.
- inputText: "luna"
- inputText: "demo"
- inputText: "123"
- tapOn: "Crew, location, references and confirmations — in one place"
- tapOn:
    text: "Log in"
    index: 1
# iOS offers to save the password.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "${EXPECT}"
    timeout: 20000
