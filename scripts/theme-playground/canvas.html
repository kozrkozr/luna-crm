<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna CRM — тема</title>
<style>
  /*
   * The panel's own styling is deliberately independent of the app's tokens.
   * Sharing them would be neat and wrong: the moment a designer sets
   * `--background` to the same value as `--foreground`, the tool they need in
   * order to undo it would have disappeared too.
   */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #17171a;
    color: #e8e8ea;
    overflow: hidden;
  }

  /* ── panel ─────────────────────────────────────────────────────────── */
  #panel {
    width: 312px;
    flex: 0 0 312px;
    height: 100%;
    overflow-y: auto;
    background: #1e1e22;
    border-right: 1px solid #2e2e34;
    padding: 14px 14px 40px;
  }
  #panel h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .2px; }
  #panel .sub { color: #8b8b93; font-size: 11px; margin-bottom: 14px; }

  fieldset { border: 0; margin: 0 0 16px; padding: 0; }
  legend {
    font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: #8b8b93; padding: 0 0 6px; width: 100%;
    border-bottom: 1px solid #2e2e34; margin-bottom: 8px;
  }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .row label { flex: 1; min-width: 0; font-size: 11.5px; color: #c3c3ca; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=color] {
    width: 26px; height: 22px; padding: 0; border: 1px solid #3a3a42;
    border-radius: 4px; background: none; cursor: pointer; flex: 0 0 26px;
  }
  .row input[type=text] {
    width: 74px; flex: 0 0 74px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #141417; color: #e8e8ea; border: 1px solid #3a3a42;
    border-radius: 4px; padding: 3px 5px; text-transform: uppercase;
  }
  .row input[type=text]:focus { outline: none; border-color: #6b6b78; }
  .row.changed label::after { content: ' •'; color: #f0c674; }

  .slider { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .slider input[type=range] { flex: 1; min-width: 0; accent-color: #8b8b93; }
  .slider output { font: 11px ui-monospace, Menlo, monospace; color: #8b8b93; flex: 0 0 46px; text-align: right; }

  /* ── contrast ──────────────────────────────────────────────────────── */
  .pair { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11px; }
  .pair .chip {
    flex: 0 0 54px; text-align: center; border-radius: 3px; padding: 2px 0;
    font-size: 10px; border: 1px solid rgba(255,255,255,.14);
  }
  .pair .name { flex: 1; color: #a4a4ac; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pair .ratio { font: 11px ui-monospace, Menlo, monospace; flex: 0 0 52px; text-align: right; }
  .pair.pass .ratio { color: #7fce8f; }
  /* Already below the threshold in global.css — reported, not blamed. */
  .pair.inherited .ratio { color: #8b8b93; }
  .pair.inherited .name { color: #83838c; font-style: italic; }
  .pair.fail .ratio { color: #f08a7f; }

  /* ── buttons ───────────────────────────────────────────────────────── */
  button {
    font: 11.5px inherit; color: #e8e8ea; background: #2a2a30;
    border: 1px solid #3a3a42; border-radius: 5px; padding: 5px 9px; cursor: pointer;
  }
  button:hover { background: #33333a; }
  button:active { background: #26262c; }
  .buttons { display: flex; flex-wrap: wrap; gap: 5px; }
  .buttons button { flex: 1 1 auto; }

  select {
    width: 100%; font: 11.5px inherit; color: #e8e8ea; background: #141417;
    border: 1px solid #3a3a42; border-radius: 5px; padding: 4px 6px; margin-bottom: 6px;
  }

  .check { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11.5px; color: #c3c3ca; }
  .check input { accent-color: #8b8b93; }
  .check .count { color: #6f6f78; font: 10px ui-monospace, Menlo, monospace; }

  .note { font-size: 10.5px; line-height: 1.5; color: #83838c; }
  .note code { font: 10px ui-monospace, Menlo, monospace; color: #a4a4ac; }
  .note ul { margin: 4px 0 0; padding-left: 15px; }
  .note li { margin-bottom: 2px; }
  .warn { color: #f0c674; }

  /* ── canvas ────────────────────────────────────────────────────────── */
  #stage { flex: 1; height: 100%; overflow: auto; padding: 20px 24px 80px; }
  #stage h2 {
    font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase;
    color: #7a7a83; margin: 26px 0 12px; font-weight: 600;
  }
  #stage h2:first-child { margin-top: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .screen { }
  .screen .cap {
    font-size: 11px; color: #9a9aa2; margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .screen .frame {
    position: relative; overflow: hidden;
    border: 1px solid #34343c; border-radius: 10px; background: #0a0a0a;
  }
  .screen iframe {
    display: block; width: 390px; height: 844px; border: 0;
    transform-origin: 0 0;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #17171a; z-index: 10; text-align: center; color: #9a9aa2;
    font-size: 12px; line-height: 1.6;
  }
  #boot .err { color: #f08a7f; max-width: 520px; text-align: left; }
  #boot code { font: 11px ui-monospace, Menlo, monospace; color: #e8e8ea; }
</style>
</head>
<body>
  <div id="panel">
    <h1>Тема Luna CRM</h1>
    <div class="sub" id="meta">завантаження…</div>
    <div id="controls"></div>
  </div>
  <div id="stage"></div>
  <div id="boot">готую полотно…</div>
  <script src="/__theme/canvas.js"></script>
</body>
</html>
