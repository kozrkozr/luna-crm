<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna CRM — прототип</title>
<style>
  :root {
    --bg: #f6f5f3;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e5e2dc;
    --accent: #b8562f;
    --accent-ink: #ffffff;
    --ok: #2f7d4f;
    --ok-bg: #e7f4ec;
    --pending: #a06a1c;
    --pending-bg: #fbf0dd;
    --bad: #b23b3b;
    --bad-bg: #fbeaea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--card);
    display: flex;
    flex-direction: column;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  header.topbar .brand { font-weight: 700; font-size: 17px; }
  header.topbar .right { display: flex; gap: 8px; align-items: center; }
  header.topbar .icon-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 14px;
    cursor: pointer;
  }
  header.topbar .lang-switch { display: flex; gap: 4px; }
  header.topbar .lang-switch button {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
  }
  header.topbar .lang-switch button.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  main { flex: 1; padding: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 18px 0 10px; }
  h2:first-of-type { margin-top: 0; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .fake-tag {
    display: inline-block;
    font-size: 10px;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 0 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card);
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; font-weight: 600; }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .field-error {
    color: var(--bad);
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }
  .field-error.show { display: block; }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-bg); }
  .btn-ghost { background: transparent; color: var(--accent); padding: 6px 0; font-weight: 600; }
  .btn-block { width: 100%; margin-top: 8px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .status {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .status.pending { background: var(--pending-bg); color: var(--pending); }
  .status.confirmed { background: var(--ok-bg); color: var(--ok); }
  .status.declined { background: var(--bad-bg); color: var(--bad); }
  .status.new { background: var(--pending-bg); color: var(--pending); }
  .status.finished { background: var(--ok-bg); color: var(--ok); }
  .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .ref-thumb {
    border-radius: 10px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
    text-align: center;
    padding: 6px;
  }
  .ref-add-row { display: flex; gap: 6px; margin: 10px 0; }
  .ref-add-row input { flex: 1; }
  .icon-btn-square {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    width: 38px;
    min-width: 38px;
    font-size: 16px;
    cursor: pointer;
  }
  .empty-state { text-align: center; padding: 40px 10px; color: var(--muted); }
  .error-screen { text-align: center; padding: 60px 20px; }
  .error-screen .icon { font-size: 36px; margin-bottom: 10px; }
  nav.demo-nav {
    border-top: 1px solid var(--line);
    padding: 10px 18px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  nav.demo-nav button {
    border: 1px dashed var(--line);
    background: transparent;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
    color: var(--muted);
  }
  .crew-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); gap: 8px; }
  .crew-row:first-child { border-top: none; }
  .crew-row .crew-main { flex: 1; }
  .crew-row.clickable { cursor: pointer; }
  .crew-row.clickable:hover .crew-main strong { color: var(--accent); }
  .crew-actions { display: flex; gap: 4px; align-items: center; }
  .crew-actions button { border: none; background: transparent; font-size: 15px; cursor: pointer; padding: 2px 4px; }
  .chip {
    display: inline-block;
    font-size: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
    margin-right: 4px;
  }
  .rt-toolbar { display: flex; gap: 4px; margin-bottom: 4px; }
  .rt-toolbar span {
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); background: var(--bg);
  }
  .file-section {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 10px;
    margin-top: 8px;
    font-size: 13px;
  }
  .file-section a { color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .cal-dow { font-size: 10px; color: var(--muted); padding-bottom: 4px; }
  .cal-grid .cal-day {
    font-size: 12px;
    padding: 6px 0;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
  }
  .cal-grid .cal-day.empty { cursor: default; }
  .cal-grid .cal-day.has-shoot { background: var(--pending-bg); font-weight: 700; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-nav button { border: none; background: transparent; font-size: 14px; cursor: pointer; color: var(--muted); }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function langSwitchHtml() {
  return `

}

function calendarHtml() {

  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday-first

  const shootDates = new Set(state.shoots.map(s => s.date));
  const dow = state.lang === "uk" ? ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"] : ["Mo","Tu","We","Th","Fr","Sa","Su"];
  const monthNames = state.lang === "uk"
    ? ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"]
    : ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const has = shootDates.has(iso);
    cells += `<div class="cal-day ${has ? "has-shoot" : ""}" data-action="cal-day-click" data-date="${iso}">${d}</div>`;
  }

  return `
    <div class="card">
      <div class="cal-nav">
        <button data-action="cal-prev">‹</button>
        <strong style="font-size:13px;">${monthNames[m]} ${y}</strong>
        <button data-action="cal-next">›</button>
      </div>
      <div class="cal-grid">
        ${dow.map(d => `<div class="cal-dow">${d}</div>`).join("")}
        ${cells}
      </div>
    </div>`;
}

    `<div class="ref-thumb" style="background:${REF_COLORS[i % REF_COLORS.length]}">${esc(r.label)}</div>`

  html += `</div>`;
  if (overflow) {

function render() {
  if (ACCOUNT_VIEWS.includes(state.view) && !state.loggedIn) {
    state.view = "auth";
  }
  const app = document.getElementById("app");
  let html;
  switch (state.view) {
    case "auth": html = screenAuth(); break;
    case "profile": html = screenProfile(); break;
    case "shootList": html = screenShootList(); break;
    case "newShoot": html = screenNewShoot(); break;
    case "editShoot": html = screenEditShoot(); break;
    case "shootDetail": html = screenShootDetail(); break;
    case "addCrew": html = screenAddCrew(); break;
    case "allReferences": html = screenAllReferences(); break;
    case "crewLinkView": html = screenCrewLinkView(); break;
    case "crewPeerDetail": html = screenCrewPeerDetail(); break;
    case "clientLinkView": html = screenClientLinkView(); break;
    case "brokenLink": html = screenBrokenLink(); break;
    default: html = screenAuth();
  }
  app.innerHTML = html;
}

/* ---------------------------------------------------------------- actions */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "lang") { state.lang = btn.dataset.lang; render(); return; }
  if (action === "toggle-auth") { state.authMode = state.authMode === "login" ? "register" : "login"; state.authError = ""; render(); return; }
  if (action === "new-shoot") { state.view = "newShoot"; render(); return; }
  if (action === "back-to-list") { state.view = "shootList"; render(); return; }
  if (action === "toggle-empty-demo") { state.showEmptyDemo = !state.showEmptyDemo; render(); return; }
  if (action === "open-shoot") { state.currentShootId = btn.dataset.id; state.view = "shootDetail"; render(); return; }
  if (action === "open-profile") { state.view = "profile"; render(); return; }
  if (action === "logout") {
    state.loggedIn = false;
    state.currentUser = null;
    state.view = "auth";
    toast(state.lang === "uk" ? "Ви вийшли (US-017)" : "Logged out (US-017)");
    render();
    return;
  }
  if (action === "add-crew") { state.currentShootId = btn.dataset.shoot; state.view = "addCrew"; render(); return; }
  if (action === "edit-shoot") { state.currentShootId = btn.dataset.shoot; state.view = "editShoot"; render(); return; }
  if (action === "toggle-loc-image") {
    const loc = findShoot(state.currentShootId).location;
    loc.hasImage = !loc.hasImage;
    btn.textContent = (loc.hasImage ? "✓ " : "") + t("attachImageDemo");
    return;
  }
  if (action === "toggle-loc-video") {
    const loc = findShoot(state.currentShootId).location;
    loc.hasVideo = !loc.hasVideo;
    btn.textContent = (loc.hasVideo ? "✓ " : "") + t("attachVideoDemo");
    return;
  }
  if (action === "toggle-status") {
    const shoot = findShoot(btn.dataset.shoot);
    shoot.status = shoot.status === "new" ? "finished" : "new";
    render();
    return;
  }
  if (action === "delete-shoot") {
    if (!confirm(t("confirmDeleteShoot"))) return;
    state.shoots = state.shoots.filter(s => s.id !== btn.dataset.shoot);
    state.view = "shootList";
    render();
    return;
  }
  if (action === "remove-crew") {
    if (!confirm(t("confirmRemoveCrew"))) return;
    const shoot = findShoot(btn.dataset.shoot);
    shoot.crew = shoot.crew.filter(c => c.id !== btn.dataset.crew);
    render();
    return;
  }
  if (action === "view-as-crew") {
    state.currentShootId = btn.dataset.shoot;
    const shoot = findShoot(state.currentShootId);
    const pending = shoot.crew.find(c => c.status === "pending");
    state.currentCrewId = pending ? pending.id : (shoot.crew[0] ? shoot.crew[0].id : null);
    state.view = "crewLinkView"; render(); return;
  }
  if (action === "view-peer") {
    state.peerCrewId = btn.dataset.crew;
    state.peerDetailContext = "crew";
    state.view = "crewPeerDetail";
    render();
    return;
  }
  if (action === "view-peer-as-client") {
    state.currentShootId = btn.dataset.shoot;
    state.peerCrewId = btn.dataset.crew;
    state.peerDetailContext = "client";
    state.view = "crewPeerDetail";
    render();
    return;
  }
  if (action === "back-to-crew-link") { state.view = "crewLinkView"; render(); return; }
  if (action === "back-to-client-link") { state.view = "clientLinkView"; render(); return; }
  if (action === "view-as-client") { state.currentShootId = btn.dataset.shoot; state.view = "clientLinkView"; render(); return; }
  if (action === "view-broken-link") { state.view = "brokenLink"; render(); return; }
  if (action === "back-to-detail") { state.view = "shootDetail"; render(); return; }
  if (action === "copy-link") {
    const fake = `https://luna.app/l/${btn.dataset.shoot}-${btn.dataset.crew}`;
    toast(`${t("linkCopied")} ${fake}`);
    return;
  }
  if (action === "crew-respond") {
    const shoot = findShoot(btn.dataset.shoot);
    const crew = shoot.crew.find(c => c.id === btn.dataset.crew);
    crew.status = btn.dataset.status;
    render();
    return;
  }
  if (action === "show-all-references") {
    state.currentShootId = btn.dataset.shoot;
    state.allReferencesReturn = btn.dataset.return;
    state.view = "allReferences";
    render();
    return;
  }
  if (action === "back-from-all-references") { state.view = state.allReferencesReturn; render(); return; }
  if (action === "pick-gallery") {
    document.getElementById("gallery-input").click();
    return;
  }
  if (action === "cal-prev") {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    render(); return;
  }
  if (action === "cal-next") {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    render(); return;
  }
  if (action === "cal-day-click") { toast(t("calDateQuestion")); return; }
  if (action === "toggle-new-crew-image") {
    state.newCrewNoteHasImage = !state.newCrewNoteHasImage;
    btn.textContent = (state.newCrewNoteHasImage ? "✓ " : "") + "🖼";
    return;
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "gallery-input" && e.target.files[0]) {
    const shoot = findShoot(e.target.dataset.shoot);
    shoot.references.push({ id: "r" + Date.now(), label: e.target.files[0].name + " " + t("demoLabel") });
    render();
  }
});

document.addEventListener("submit", (e) => {
  const form = e.target.closest("form");
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());

  if (kind === "auth") {
    if (state.authMode === "register") {
      if (!data.role) { state.authError = t("roleRequired"); render(); return; }
      state.authError = "";
      state.loggedIn = true;
      state.currentUser = { name: data.name || (state.lang === "uk" ? "Без імені (демо)" : "Unnamed (demo)"), email: data.email || "—", role: data.role, social: data.social || "" };
      state.view = "shootList";
      render();
      return;
    } else {
      if (!data.email || !data.password) { state.authError = t("wrongCreds"); render(); return; }
      state.authError = "";
      state.loggedIn = true;
      state.currentUser = { name: "Ілона (демо)", email: data.email, role: "Фотограф", social: "@ilona.demo" };
      state.view = "shootList";
      render();
      return;
    }
  }

  if (kind === "new-shoot") {
    const errEl = document.getElementById("date-error");
    if (!data.date) { errEl.classList.add("show"); return; }
    errEl.classList.remove("show");
    const id = "s" + (state.shoots.length + 1) + "-" + Date.now();
    state.shoots.push({
      id, client: data.client || (state.lang === "uk" ? "Без імені (демо)" : "Unnamed (demo)"),
      contact: data.contact || "—", date: data.date, status: "new",
      location: { address: "", notes: "", hasImage: false, hasVideo: false },
      rawFilesLink: "", finishedPhotosLink: "",
      references: [], crew: [],
    });
    state.currentShootId = id;
    state.view = "shootDetail";
    render();
    return;
  }

  if (kind === "edit-shoot") {
    const errEl = document.getElementById("edit-date-error");
    if (!data.date) { errEl.classList.add("show"); return; }
    errEl.classList.remove("show");
    const shoot = findShoot(form.dataset.shoot);
    shoot.date = data.date;
    shoot.location.address = data.address || "";
    shoot.location.notes = data.notes || "";
    shoot.rawFilesLink = data.rawFilesLink || "";
    shoot.finishedPhotosLink = data.finishedPhotosLink || "";
    state.view = "shootDetail";
    render();
    return;
  }

  if (kind === "add-reference") {
    const shoot = findShoot(form.dataset.shoot);
    if (data.link) shoot.references.push({ id: "r" + Date.now(), label: data.link + " " + t("demoLabel") });
    render();
    return;
  }

  if (kind === "add-crew") {
    const errEl = document.getElementById("contact-error");
    if (!data.contact) { errEl.classList.add("show"); return; }
    errEl.classList.remove("show");
    const shoot = findShoot(form.dataset.shoot);
    shoot.crew.push({ id: "c" + Date.now(), name: data.name || "—", role: data.role, contact: data.contact, instagram: data.instagram || "", notes: data.notes || "", notesHasImage: state.newCrewNoteHasImage, status: "pending" });
    state.newCrewNoteHasImage = false;
    state.view = "shootDetail";
    render();
    return;
  }
});

render();
</script>
</body>
</html>
